[package]
name = "gravity-sandbox"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "2d",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_ui_widgets",
    "default_font",
    "bevy_window",
    "bevy_input_focus",
    "bevy_picking",
    "mesh_picking",
    "ui_picking",
    "custom_cursor",
    "bevy_world_serialization",
    "bevy_asset",
    "bevy_sprite",
    "bevy_render",
    "bevy_core_pipeline",
    "webgpu",
    "x11",
    "wayland",
] }

avian2d = "0.7"
bevy_firefly = "0.19"
bevy_shader = { version = "0.19", default-features = false }
libm = "=0.2.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = "0.2"
wasm-bindgen = "0.2"
rand = "0.8"

[target.wasm32-unknown-unknown.dependencies]
web-sys = { version = "0.3", features = ["console", "Window", "Document"] }
getrandom = { version = "0.2", features = ["js"] }

# Enable optimization for dependencies only (keep own code unoptimized for fast compile)
[dev-dependencies]
naga = { version = "29", features = ["wgsl-in", "glsl-out"] }
# Salvataggio PNG nel test della normal map (per ispezione visiva)
image = "0.25"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3

# WASM release profile: optimize for size
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

# PATCH spike: bevy_firefly 0.19.0 panica (unwrap su None) al primo frame su
# WebGPU quando le PointLight2d non sono ancora "visibili" (VisibilityTimer
# Bevy 0.19). Usiamo una copia vendored con la fix (None -> skip) in
# vendor/bevy_firefly/src/lights.rs.
[patch.crates-io]
bevy_firefly = { path = "vendor/bevy_firefly" }
