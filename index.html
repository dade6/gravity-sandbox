<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Sandbox v0.14.188</title>
    <script>
        // CONSOLE SU IPHONE: Eruda compare SOLO con ?debug nell'URL
        // (es. https://...ts.net:10000/?debug): bottone in basso a destra
        // -> console log/errori/network. Senza flag: nessun bottone.
        (function () {
            if (!new URLSearchParams(location.search).has('debug')) return;
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda';
            s.onload = function () { window.eruda && window.eruda.init(); };
            document.head.appendChild(s);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #bevy-canvas {
            display: block;
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #toolbar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 48px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .tb-btn {
            height: 30px;
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            background: rgba(60, 65, 90, 0.9);
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tb-btn:hover { background: rgba(80, 85, 120, 0.95); color: #fff; }
        .tb-btn.active {
            background: rgba(100, 120, 255, 0.85);
            color: #fff;
            box-shadow: 0 0 8px rgba(100, 120, 255, 0.4);
        }
        #toolbar .spacer { flex: 1; }
        #toolbar .version { color: rgba(255,255,255,0.3); font-size: 12px; pointer-events: none; }

        #timeline {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 16px;
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .tl-btn {
            height: 32px;
            padding: 0 14px;
            border: none;
            border-radius: 6px;
            background: rgba(60, 65, 90, 0.9);
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tl-btn:hover { background: rgba(80, 85, 120, 0.95); color: #fff; }
        .tl-btn.active {
            background: rgba(255, 200, 50, 0.25);
            color: #ffd;
        }
        #timeline .info { color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none; }

        /* Diagnostica visibile SOLO in modalità debug (?debug nell'URL).
           Prima badge e riquadro di stato erano sempre a schermo: su iPhone
           coprivano la scena. Ora sono display:none di default e la regola
           `body.debug-ui` (applicata dallo script di boot quando c'è ?debug)
           li riporta visibili con lo stile originale. */
        #version-badge, #debug-state { display: none; }
        body.debug-ui #version-badge {
            position: fixed; bottom: 64px; right: 12px;
            color: rgba(255,255,255,0.25); font: 11px monospace;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.4); padding: 2px 6px;
            border-radius: 4px;
            /* Leggibile anche con la diagnostica lunga: va a capo invece di
               uscire dallo schermo (su iPhone la riga singola si perdeva). */
            max-width: min(92vw, 520px);
            white-space: normal; text-align: right;
            word-break: break-word; line-height: 1.35;
            display: block;
        }
        body.debug-ui #debug-state {
            position: fixed; bottom: 80px; left: 12px;
            color: #ffffff; background: rgba(0,0,0,0.75);
            padding: 10px 18px; border-radius: 10px;
            font: 12px monospace; z-index: 99; display: block;
        }
        #error-details {
            position: fixed; top: 56px; left: 12px; right: 12px;
            z-index: 300;
            background: rgba(20, 8, 8, 0.92);
            border: 1px solid rgba(255, 80, 80, 0.5);
            border-radius: 8px;
            padding: 8px 10px;
            max-height: 45vh;
            overflow: auto;
            -webkit-user-select: text; user-select: text;
            -webkit-overflow-scrolling: touch;
        }
        #error-details pre {
            font: 11px/1.45 ui-monospace, Menlo, monospace;
            color: #ffb4b4; white-space: pre-wrap; word-break: break-all;
            margin: 0 0 6px 0; -webkit-user-select: text; user-select: text;
        }
        #copy-err {
            font: 12px -apple-system, sans-serif;
            background: rgba(255, 80, 80, 0.25); color: #ffd7d7;
            border: 1px solid rgba(255, 120, 120, 0.6); border-radius: 5px;
            padding: 4px 10px; cursor: pointer; display: block; margin-bottom: 6px;
        }
        #copy-err:active { background: rgba(255, 80, 80, 0.45); }

        /* La barra di caricamento all'avvio NON è più markup/CSS inline: è
           il componente loading_bar.js (ES module, CSS autoiniettato con gli
           STESSI token) montato da createLoadingBar({mount:'#ui-overlay'})
           dentro lo script module del boot. #ui-overlay resta
           pointer-events:none: la barra ha pointer-events:auto SOLO su se
           stessa (bottone 'Riprova' cliccabile) e non copre la toolbar. */
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body>
    <canvas id="bevy-canvas" tabindex="0"></canvas>

    <!-- Diagnostica: visibili SOLO con ?debug nell'URL (vedi <style> sopra:
         #version-badge e #debug-state sono display:none di default). Il
         badge versione esiste comunque nel DOM perché lo script di boot lo
         cerca per gli avvisi, ma resta invisibile senza ?debug. -->
    <div id="version-badge">v0.14.188</div>
    <div id="debug-state"></div>
    <div id="error-details" hidden>
        <button id="copy-err">📋 Copia errore</button>
        <pre id="error-text"></pre>
    </div>

    <!-- Overlay UI (z-index 100, pointer-events:none): la barra di
         caricamento WASM all'avvio è montata QUI dentro dal modulo
         loading_bar.js (createLoadingBar): il componente inietta il proprio
         markup/CSS con gli stessi token del progetto. -->
    <div id="ui-overlay"></div>

    <script>
        // MODALITÀ DEBUG: unico punto di verità, `?debug` nell'URL.
        //  - `body.debug-ui` rende visibili badge versione e riquadro stato
        //    (nascosti di default dal CSS);
        //  - lo stesso flag abilita Eruda e il motion log (più sotto).
        // Va impostato QUI, prima di tutto il resto, così gli avvisi di boot
        // (es. "WebGPU richiede HTTPS") possono già scrivere nel badge.
        const DEBUG_MODE = new URLSearchParams(location.search).has('debug');
        if (DEBUG_MODE) document.body.classList.add('debug-ui');

        // WebGPU richiede un CONTESTO SICURO (HTTPS): su HTTP il browser non
        // espone navigator.gpu e bevy panica (FailedToCreateSurfaceForAnyBackend).
        // Avviso chiaro invece del crash + badge spiegato.
        if (!window.isSecureContext) {
            const v = document.getElementById('version-badge');
            if (v) v.textContent = '⚠️ WebGPU richiede HTTPS: apri https://instance-20260607-0236.tail8514d0.ts.net:10000/';
        }

        // ---- Boot pre-moduli: qui perché è ROBUSTO ai 404 degli import ES ----
        // Il bootstrap vero (init del WASM) è nello <script type="module">
        // sotto: un fetch fallito di un import statico (rete che muore a
        // metà) NON esegue NESSUN codice del modulo — nemmeno gli handler
        // degli errori. Queste funzioni vivono in uno script CLASSIC che
        // parte sempre: il pannello errori esiste anche se i moduli non
        // arrivano, e il badge mostra il motivo.

        // Pannello errore copiabile: mostra messaggio completo + stack in un
        // elemento selezionabile, con bottone "Copia" (clipboard API su HTTPS).
        // Utile per la diagnosi remota senza DevTools: Davide copia e incolla.
        // Intercetta ANCHE console.error: il panic hook di lib.rs scrive lì il
        // messaggio "PANIC: panicked at src/...:line" — senza questo, la
        // posizione esatta del trap si perde (il pannello vede solo il
        // RuntimeError generico).
        function appendError(text) {
            const box = document.getElementById('error-details');
            const pre = document.getElementById('error-text');
            if (!pre) return;
            const line = '[' + new Date().toISOString().substring(11, 23) + '] ' + text;
            const existing = pre.textContent;
            pre.textContent = existing ? existing + '\n' + line : line;
            if (box) box.hidden = false;
        }
        const origError = console.error.bind(console);
        console.error = (...args) => {
            try { appendError(args.map(a => (a && a.message) ? a.message : String(a)).join(' ').substring(0, 1500)); } catch (e) {}
            origError(...args);
        };
        function showError(title, message, stack) {
            appendError(title + '\n' + message + (stack ? '\nSTACK:\n' + stack : ''));
            const v = document.getElementById('version-badge');
            if (v && v.textContent.indexOf('🛑') < 0 && v.textContent.indexOf('ERR:') < 0) {
                v.textContent += ' ERR:' + (message || '').substring(0, 300);
            }
        }
        const copyBtn = document.getElementById('copy-err');
        if (copyBtn) {
            copyBtn.addEventListener('click', () => {
                const txt = (document.getElementById('error-text') || {}).textContent || '';
                const done = () => { copyBtn.textContent = '✅ Copiato'; setTimeout(() => { copyBtn.textContent = '📋 Copia errore'; }, 2000); };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(done).catch(() => {
                        // fallback: selezione manuale
                        const pre = document.getElementById('error-text');
                        const range = document.createRange();
                        range.selectNodeContents(pre);
                        const sel = window.getSelection();
                        sel.removeAllRanges(); sel.addRange(range);
                        done();
                    });
                } else {
                    const pre = document.getElementById('error-text');
                    const range = document.createRange();
                    range.selectNodeContents(pre);
                    const sel = window.getSelection();
                    sel.removeAllRanges(); sel.addRange(range);
                    done();
                }
            });
        }

        window.addEventListener('error', (e) => {
            const stack = (e.error && e.error.stack ? e.error.stack : '').substring(0, 3000);
            showError('ERRORE RUNTIME', e.message || String(e.error || 'unknown'), stack);
            console.error('[PAGEERROR full]', e.message, stack);
        });

        // Focus DOM del canvas: senza questo, il browser non instrada gli
        // eventi tastiera a winit/Bevy su WASM (i tasti vanno al body).
        // Vale per desktop E tastiera fisica su iPhone (niente input nascosto:
        // il fronte tastiera virtuale mobile è stato chiuso — editing su Mac).
        // Bridge tastiera Safari Mac: input nascosto (vedi sotto). Dichiarato
        // qui perché i listener di focus devono escluderlo dal furto di focus.
        window.__canvasFocusInit = function (hiddenInputRef) {
            const canvasEl = document.getElementById('bevy-canvas');
            const hiddenInput = hiddenInputRef; // { current: input|null } condiviso col modulo
            // Focus DOM del canvas, robusto anche su Safari Mac: Safari annulla il
            // focus() durante pointerdown se non preceduto da preventDefault; in
            // aggiunta, un keydown con capture sul document ri-focalizza il canvas
            // prima che il tasto vada altrove (i campi Bevy ricevono i tasti solo
            // se il canvas ha il focus del browser).
            canvasEl.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                canvasEl.focus({ preventScroll: true });
            });
            canvasEl.addEventListener('click', () => canvasEl.focus({ preventScroll: true }));
            document.addEventListener('keydown', () => { if (!hiddenInput.current || document.activeElement !== hiddenInput.current) canvasEl.focus({ preventScroll: true }); }, { capture: true });
            document.addEventListener('keyup', () => { if (!hiddenInput.current || document.activeElement !== hiddenInput.current) canvasEl.focus({ preventScroll: true }); }, { capture: true });
        };
    </script>

    <script type="module">
        import init, * as sandbox from './gravity_sandbox.js?v=0.14.188';
        import { loadWasmLifecycle, createLoaderEvents } from './wasm_runtime.js';
        import { createLoadingBar } from './loading_bar.js';

        // Focus del canvas + bridge tastiera Safari Mac: stato condiviso in un
        // oggetto ref (un modulo ES non può esportare let mutabili).
        const hiddenInputRef = { current: null };
        window.__canvasFocusInit(hiddenInputRef);

        // Rilevazione dispositivo mobile: abilita il keypad numerico Bevy
        // (l'editing valori su iPhone avviene col keypad, non con la tastiera
        // di sistema che iOS Safari non permette di controllare)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        // Safari Mac: Bevy/winit non riceve i tasti fisici -> bridge con
        // input nascosto: quando un campo Bevy ha il focus, il focus del
        // browser va su questo input e i tasti vengono inoltrati a Rust via
        // set_text_input(mode, testo) -> apply_mobile_text_input li applica.
        const isSafariMac = !isIOS && /Safari/.test(navigator.userAgent) && !/Chrome|CriOS/.test(navigator.userAgent);
        function hiddenInputEnsure() {
            if (hiddenInputRef.current) return hiddenInputRef.current;
            const hi = document.createElement('input');
            hi.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;z-index:-1;width:1px;height:1px;border:0;padding:0;font-size:16px;';
            hi.autocomplete = 'off';
            hi.autocapitalize = 'off';
            hi.spellcheck = false;
            hi.addEventListener('input', () => {
                if (window.__sandbox && window.__sandbox.set_text_input) {
                    window.__sandbox.set_text_input(2, hi.value);
                }
            });
            document.body.appendChild(hi);
            hiddenInputRef.current = hi;
            return hi;
        }

        // Pannello errori/showError/console.error/window 'error': vivono
        // nello script CLASSIC sopra (devono esistere anche se gli import
        // ES di questo modulo non arrivano: un 404 su un import statico
        // non esegue NULLA di questo codice, gli handler invece servono).

        // Retry automatico del WASM: su connessioni instabili (Tailscale/DERP)
        // il fetch del .wasm può interrompersi a metà ("Load failed") -> il
        // browser NON riscarica da solo: bootFlow() ritenta fino a
        // MAX_INIT_TRIES (pattern invariato rispetto a prima).
        //
        // INTEGRAZIONE (t_8553586d): il fetch manuale inline è sostituito da
        // loadWasmLifecycle() (wasm_runtime.js) che compone downloadWasm
        // (streaming + % reale gzip-aware) -> compileWasm (compilazione REALE
        // con eventi attorno) -> init del glue (Module precompilato passato a
        // init({module_or_path}): nessun fetch né ricompilazione dentro il
        // glue — il pattern Safari/CORS resta preservato).
        // La UI è loading_bar.js (createLoadingBar) montata su #ui-overlay:
        // gli eventi del bus vengono mappati 1:1 sulle fasi della barra.
        const WASM_URL = new URL('gravity_sandbox_bg.wasm?v=0.14.188', location.href).href;
        const WASM_SIZE_URL = new URL('gravity_sandbox_bg.wasm.size?v=0.14.188', location.href).href;
        const MAX_INIT_TRIES = 3;

        // ---- Barra di caricamento: componente loading_bar.js ---------------
        // createLoadingBar inietta il proprio markup/CSS (token identici al
        // vecchio #loading-bar) dentro #ui-overlay. onRetry di default:
        // rilancia il boot da CAPO (budget completo) — il bottone 'Riprova'
        // è visibile solo quando la barra è in stato errore.
        const bar = createLoadingBar({
            mount: '#ui-overlay',
            // Il bottone 'Riprova' rilancia un ciclo COMPLETO (budget pieno):
            // startBoot() gestisce anche l'esito del secondo giro — la
            // Promise di bootFlow non resta mai non-gestita (un secondo
            // fallimento deve rimettere la barra in errore, non generare un
            // unhandledrejection nel pannello errori).
            onRetry: () => startBoot(),
        });

        // Diagnostica del flusso di caricamento (visibile col ?debug/eruda e
        // nei webtest via window.__bootEvents): sequenza completa degli eventi
        // del loader — l'ordine è il contratto verificato dai test.
        const bootEvents = [];
        function logBoot(name, payload) {
            bootEvents.push({ name, payload });
            try { console.log('[boot:' + name + ']', payload); } catch (e) {}
        }
        window.__bootEvents = bootEvents;

        // ---- Mappatura eventi loader (wasm_runtime.js) -> barra (loading_bar.js)
        // Il bus riceve TUTTI gli eventi del ciclo di vita; la barra mostra:
        //   download-start/progress -> fase download con % e byte
        //     ('Download… 42% · 21.6 MB / 51.4 MB'; senza totale: indeterminata)
        //   download-end NON mappato -> la barra resta al 100% finché
        //     compile-start (contratto t_63406e55)
        //   compile-start -> fase 'Compilazione…' animata indeterminata
        //   ready -> done(): fill 100%, fade-out senza layout shift
        //   error -> stato errore rosso (gestito in bootFlow, non qui)
        const bus = createLoaderEvents();
        bus.on('download-start',   (p) => { logBoot('download-start', p); bar.update('download', p); });
        bus.on('download-progress',(p) => { logBoot('download-progress', p); bar.update('download', p); });
        bus.on('download-end',     (p) => { logBoot('download-end', p); });
        bus.on('compile-start',    (p) => { logBoot('compile-start', p); bar.update('compile'); });
        bus.on('compile-end',      (p) => { logBoot('compile-end', p); });
        bus.on('ready',            (p) => { logBoot('ready', p); bar.update('ready'); });

        // bootFlow(tries): UN ciclo di caricamento con retry automatico.
        // - loadWasmLifecycle NON ritenta da solo (contratto wasm_runtime.js):
        //   il retry resta qui (MAX_INIT_TRIES, pausa 1.5s, label 'Riprovo…'
        //   indeterminata — la barra NON resta a metà congelata tra i
        //   tentativi).
        // - n = tentativi ANCORA disponibili in QUESTO ciclo, incluso quello
        //   in corso. 'Riprovo…' appare SOLO nei tentativi di recupero
        //   interni (n < MAX): al primo giro — e al rilancio dal bottone
        //   'Riprova', il cui click handler ha già messo la label — la
        //   prima update del download (~100ms) prende il posto.
        // - La % di download parte SUBITO (sidecar pre-fetchato dentro
        //   downloadWasm: zero wait visibile prima della prima update).
        async function bootFlow(tries) {
            const n = tries || MAX_INIT_TRIES;
            if (n >= MAX_INIT_TRIES) {
                bar.show();
            } else {
                bar.update('retrying', null,
                    n === 1 ? 'Riprovo… (ultimo tentativo)' : 'Riprovo… (ancora ' + n + ' tentativi)');
            }
            try {
                const wasm = await loadWasmLifecycle(WASM_URL, {
                    init,           // glue wasm-bindgen: istanzia il Module
                    events: bus,    // -> bar.update(...) sopra
                    sizeUrl: WASM_SIZE_URL,
                    // cache 'default' (NON no-store): l'URL del wasm porta
                    // ?v=<versione> e il server risponde immutable, quindi
                    // Safari tiene il file su disco e la ricarica successiva
                    // non riscarica MB. Una build nuova cambia la versione,
                    // quindi cambia URL: nessun rischio di codice vecchio.
                    request: { cache: 'default' },
                });
                return wasm;
            } catch (err) {
                if (n <= 1) throw err;
                console.warn('[INIT retry]', n - 1, 'tentativi rimasti:', err.message);
                await new Promise((r) => setTimeout(r, 1500));
                return bootFlow(n - 1);
            }
        }

        // startBoot(): UN ciclo completo (budget MAX_INIT_TRIES) con esito
        // GESTITO. Ogni avvio — il primo e OGNI click sul bottone 'Riprova' —
        // passa da qui: nessuna Promise non-gestita, e un fallimento del
        // secondo giro rimette la barra in errore (non un unhandledrejection
        // muto nel pannello).
        function startBoot() {
            bootFlow(MAX_INIT_TRIES).then(() => {
            // App pronta: l'evento 'ready' del bus ha GIA' chiamato
            // bar.update('ready') = done() (fade-out senza layout shift)
            // dentro loadWasmLifecycle — qui restiamo solo l'avvio post-boot.
            // Espone le funzioni del modulo WASM (es. debug_state) per diagnostica
            window.__sandbox = sandbox;
            if (isIOS) sandbox.set_mobile_device(true);
            const v = document.getElementById('version-badge');
            if (v) v.textContent = 'v0.14.188 ✅';

            // Preset di livello esterno (assets/preset.json): Davide lo modifica sul
            // server e con un refresh vede il cambio, SENZA ricompilare il WASM.
            // - Dentro init().then() per garantire che il WASM sia pronto quando
            //   load_level() usa __wbindgen_malloc (chiamarlo prima = TypeError).
            // - Cache-buster (?v=Date.now) + no-store: Safari non deve servire la
            //   vecchia copia dopo una modifica del file.
            // - Fallback silenzioso: se il fetch fallisce o il JSON è invalido NON
            //   si tocca nulla -> resta il livello hardcoded di DebugSpawnPlugin.
            // - Se OK -> load_level() spinge in LOAD_COMMANDS e process_load_commands
            //   (sistemi/persistence.rs) despawna i corpi di test e spawna quelli del
            //   file al frame ECS successivo (nessun sync richiesto).
            // v0.14.152: fallback su preset.default.json se preset.json (file
            // locale, non tracciato da git) è andato perso — senza questo il
            // boot cade sul livello hardcoded DebugSpawnPlugin e (prima della
            // fix) la stella senza StarLightSettings rendeva i campi Luce/Alone
            // del pannello inapplicabili in silenzio.
            const fetchText = (url) => fetch(url, { cache: 'no-store' })
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
            fetchText('assets/preset.json?v=' + Date.now())
                .catch(err => {
                    console.warn('preset.json non caricato (' + err.message + '): fallback preset.default.json');
                    return fetchText('assets/preset.default.json?v=' + Date.now());
                })
                .then(txt => {
                    if (txt === null || txt === undefined) return;
                    try {
                        JSON.parse(txt); // valida: JSON invalido -> fallback hardcoded
                    } catch (e) {
                        console.warn('preset invalido: uso livello hardcoded (' + e.message + ')');
                        return;
                    }
                    try {
                        sandbox.set_preset(txt); // salva il preset per il Reset
                        sandbox.load_level(txt);
                    } catch (e) {
                        console.warn('preset load_level fallita: uso livello hardcoded (' + e.message + ')');
                        return;
                    }
                    console.log('preset caricato (' + txt.length + ' bytes)');
                })
                .catch(err => {
                    // preset mancante -> livello hardcoded attuale (nessun crash)
                    console.warn('preset non caricato: uso livello hardcoded (' + err.message + ')');
                });
            }).catch(err => {
            // Errore finale di init (dopo tutti i retry): la barra passa in
            // stato errore ROSSO con bottone 'Riprova' (bar.error usa il
            // baseRetryFn = l'onRetry delle opzioni -> startBoot, budget
            // pieno) — NON sparisce né resta sospesa a metà. Più il pannello
            // errori/badge esistenti per la diagnosi remota.
            bar.error(err.message || String(err));
            const v = document.getElementById('version-badge');
            if (v) v.textContent = 'v0.14.188 🛑' + (err.message || '').substring(0, 120);
            showError('ERRORE INIT', err.message || String(err), err.stack ? err.stack.substring(0, 3000) : '');
            console.error('[INIT FAIL full]', err.message, err.stack ? err.stack.substring(0, 2000) : '');
        });
        }

        // AVVIO: primo ciclo di boot (budget completo).
        startBoot();

        // Diagnostica: mostra tool/drag/selezione in tempo reale (leggibile a colpo d'occhio).
        // Il POLL completo gira SOLO in modalità debug (?debug): fuori da lì il
        // riquadro stato è display:none e il badge invisible, quindi
        // interrogare il WASM ogni 300 ms darebbe solo lavoro inutile.
        // MA il rilevamento di un WASM morto (badge 🛑) deve restare attivo
        // SEMPRE: senza, un trap renderebbe la pagina muta senza spiegazione
        // (prima si vedeva il badge, ora è nascosto). Quindi: in debug gira
        // tutto; fuori dal debug gira un watchdog leggero che guarda solo la
        // salute del WASM e, se serve, rende visibile il badge col motivo.
        let lastSys = '';
        let lastSnap = null;
        let wasmDead = false;
        let lastFocusEnt = -1; // entity Bevy focussata (bridge Safari Mac)

        if (!DEBUG_MODE) {
            setInterval(() => {
                if (!window.__sandbox || wasmDead) return;
                // ATTENZIONE: `debug_state()` restituisce STRINGA VUOTA finché
                // Bevy non ha scritto il primo snapshot. Vuoto != morto: al
                // primo giro facevo JSON.parse('') -> "Unexpected end of
                // JSON input" -> il watchdog (errato) mostrava il badge DEAD
                // e forzava la modalità debug. Solo un THROW o un JSON
                // malformato ripetuto contano come crash.
                const leggi = () => {
                    const raw = window.__sandbox.debug_state();
                    if (typeof raw !== 'string' || raw.length === 0) return false; // non pronto
                    JSON.parse(raw);
                    return true;
                };
                try {
                    if (leggi()) return;
                } catch (e) {
                    // cade sotto: si ritenta
                }
                let ok = false;
                for (let i = 0; i < 2 && !ok; i++) {
                    try { ok = leggi(); } catch (e2) { }
                }
                if (!ok) {
                    wasmDead = true;
                    // Il pannello errori (appendError) mostra gia' causa e
                    // stack: qui NON si forza `debug-ui`, altrimenti ogni
                    // caricamento senza GPU (es. browser headless) riapriva
                    // badge e riquadro a chi non ha chiesto il debug.
                    // Un solo avviso compatto, una volta sola, senza classe.
                    const testo = String(e.message || e).slice(0, 140);
                    console.error('[WASM DEAD] ' + testo);
                    document.documentElement.dataset.wasmDead = '1';
                }
            }, 2500);
        } else {
        // Se il WASM crasha (trap non-panic), debug_state() lancia -> mostriamo
        // l'ULTIMO SISTEMA eseguito dal flight recorder e lo stato congelato.
        setInterval(async () => {
            const el = document.getElementById('debug-state');
            if (!el || !window.__sandbox) return;
            let s = null;
            const vEl = document.getElementById('version-badge');
            try {
                s = JSON.parse(window.__sandbox.debug_state());
            } catch (e) {
                // Retry immediato (v0.14.68): un singolo poll fallito NON
                // deve marcare WASM DEAD (poll transitori). Solo dopo 3
                // tentativi consecutivi si marca, con la causa esatta.
                let ok2 = false;
                for (let i = 0; i < 3 && !ok2; i++) {
                    try {
                        s = JSON.parse(window.__sandbox.debug_state());
                        ok2 = true;
                    } catch (e3) { await new Promise(r => setTimeout(r, 250)); }
                }
                if (!ok2) {
                    if (!wasmDead) {
                        wasmDead = true;
                        let reason = '?';
                        try {
                            const raw = String(window.__sandbox.debug_state());
                            reason = 'RAW(len' + raw.length + '): ' + raw.slice(0, 160);
                        } catch (e2) {
                            reason = 'THROW: ' + e2.message;
                        }
                        if (vEl) vEl.textContent = 'v0.14.188 🛑 DEAD ' + reason;
                    }
                    return;
                }
            }
            wasmDead = false;
            lastSnap = s;
            // Bridge tastiera Safari Mac: il campo Bevy focussato riceve i
            // tasti tramite l'input nascosto. L'input DOM deve contenere
            // SEMPRE lo stesso testo del campo Bevy: all'apertura (o al cambio
            // campo) si inizializza col valore corrente e selezione totale.
            // PRIMA partiva vuoto -> il DEL su input vuoto NON generava
            // eventi 'input' e la cancellazione non arrivava mai al campo
            // (bug v0.14.76: "DEL non cancella, devo selezionare e ridigitare").
            if (isSafariMac && s && window.__sandbox && window.__sandbox.set_text_input) {
                const focusOn = s.focus !== 4294967295;
                if (focusOn) {
                    const focusChanged = s.focus !== lastFocusEnt;
                    if (focusChanged || !hiddenInputRef.current || document.activeElement !== hiddenInputRef.current) {
                        const hi = hiddenInputEnsure();
                        let cur = '';
                        if (typeof s.focused_text === 'string') {
                            const eq = s.focused_text.indexOf('=');
                            if (eq >= 0) cur = s.focused_text.slice(eq + 1);
                        }
                        hi.value = cur;
                        hi.focus({ preventScroll: true });
                        hi.select();
                    }
                    lastFocusEnt = s.focus;
                } else {
                    lastFocusEnt = -1;
                    if (hiddenInputRef.current && document.activeElement === hiddenInputRef.current) {
                        hiddenInputRef.current.blur();
                    }
                }
            }
            if (s.last_system) lastSys = s.last_system;
            const toolShort = { Select: 'SEL', Add: 'ADD', Move: 'MOV', Delete: 'DEL' }[s.tool] || s.tool;
            const focusTxt = s.focus !== 4294967295 ? 'focus ON' : 'focus off';
            el.textContent = `${toolShort} | ${s.paused ? 'PAUSA' : 'PLAY'} | drag ${s.drag_active ? (s.drag_engaged ? 'ON' : 'hold') : 'off'} | ${s.bodies ? s.bodies.length : 0} corpi | ${focusTxt}${s.focused_text ? ' | ' + s.focused_text.substring(0, 14) : ''} | sys:${s.last_system || ''} f${s.frame || 0}${s.firefly ? ' | FF:' + (s.firefly.cam ? 'cam' : 'NOcam') + ' L' + s.firefly.lights + '/' + s.firefly.exL + ' O' + s.firefly.occluders + '/' + s.firefly.exO + ' S' + s.firefly.sprites + ' N' + s.firefly.nmaps : ''}`;
            // Diagnostica normal map nel badge versione (leggibile da screenshot)
            const vb = document.getElementById('version-badge');
            if (vb && s.firefly) {
                // Reset del prefisso: il "🛑 DEAD" non deve sopravvivere a un
                // poll riuscito (il badge parte sempre da "v0.14.152 ✅").
                // La coda di diagnostica si toglie con una regex GENERICA
                // (` N<numero> ...` fino in fondo): una regex che elencava i
                // singoli campi non copriva i campi nuovi e il badge cresceva
                // a ogni poll (bug v0.14.152).
                // v0.14.188: il prefisso è tutto ciò che sta PRIMA del
                // marcatore BADGE_MARK, non ciò che resta dopo una regex che
                // assumeva un ordine fisso dei campi. Con `A` (algoritmo coni)
                // messo prima di ` N<numero>` il vecchio taglio
                // `replace(/ N\d+ m.*$/, '')` lo lasciava nel prefisso e lo
                // ricopiava a ogni poll (300 ms): il badge cresceva di un campo
                // per giro fino a riempire lo schermo. Ora: prefisso = testo
                // prima del marcatore, coda = tutto ricostruito ogni volta ->
                // lunghezza costante per costruzione.
                const BADGE_MARK = ' ▸';
                const curBadge = vb.textContent || '';
                if (curBadge.indexOf('🛑') >= 0 || curBadge.indexOf('ERR:') >= 0) {
                    // Badge in stato d'errore: non si tocca (niente crescita e
                    // il messaggio resta leggibile).
                    return;
                }
                const nm = curBadge.indexOf(BADGE_MARK) >= 0
                    ? curBadge.slice(0, curBadge.indexOf(BADGE_MARK))
                    : 'v0.14.188 ✅';
                vb.textContent = nm + BADGE_MARK + 'A' + (s.firefly.salg !== undefined ? s.firefly.salg : '?') + ' N' + s.firefly.nmaps + ' m' + (s.firefly.nmode !== undefined ? s.firefly.nmode : '?') + ' g' + (s.firefly.gnmode !== undefined ? s.firefly.gnmode : '?') + ' s' + (s.firefly.skipN !== undefined ? s.firefly.skipN + '/' + s.firefly.procS : '?') + ' q' + (s.firefly.qItems !== undefined ? s.firefly.qItems : '?') + ' L' + (s.firefly.lights !== undefined ? s.firefly.lights : '?') + '/' + (s.firefly.exL !== undefined ? s.firefly.exL : '?') + ' O' + (s.firefly.occluders !== undefined ? s.firefly.occluders : '?') + '/' + (s.firefly.exO !== undefined ? s.firefly.exO : '?') + (s.firefly.vpush !== undefined ? ' V' + s.firefly.vpush + '/' + s.firefly.vnoclass + '/' + s.firefly.vitems + ' U' + (s.firefly.vgpu || '?') : '') + (s.star ? ' S' + s.star : '') + (s.sky ? ' | ' + (s.sky.fps ? Math.round(s.sky.fps) + 'fps' : '?') + ' ★' + s.sky.stars + '/' + s.sky.sectors + 's' + (s.sky.lod ? ' LOD' + s.sky.lod : '') + ' F' + (s.sky.fr !== undefined ? s.sky.fr.toFixed(2) : '?') + ' G' + (s.sky.gap !== undefined ? s.sky.gap.toFixed(2) : '?') + ' E' + (s.sky.eoff !== undefined ? s.sky.eoff : '?') + ' M' + (s.sky.dtmax !== undefined ? Math.round(s.sky.dtmax) + 'ms' : '?') : '');
            }
        }, 300);
        } // fine else: poll diagnostico attivo solo con ?debug

        // Log di movimento per-frame -> POST /log (CSV su file nella VM).
        // Solo con ?debug: i valori (gap Transform/Position, frazione di
        // interpolazione, zoom) cambiano a 60-120 Hz e a occhio si prendono
        // nel frame sbagliato. Il WASM non ha thread né filesystem: accumula
        // in RAM (`motion_log.rs`), qui svuotiamo ogni 2 s verso il server,
        // che appende a ~/gravity-logs/motion-<sessione>.csv.
        if (new URLSearchParams(location.search).has('debug')) {
            const MOTION_SESSION = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)
                + '-' + Math.random().toString(36).slice(2, 6);
            window.__motion_session = MOTION_SESSION;
            setInterval(async () => {
                try {
                    if (!sandbox.drain_motion_log) return;
                    const csv = sandbox.drain_motion_log();
                    if (!csv) return;
                    const res = await fetch('log?s=' + encodeURIComponent(MOTION_SESSION), {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/csv' },
                        body: csv,
                    });
                    if (!res.ok) console.warn('motion log: HTTP', res.status);
                } catch (e) {
                    console.warn('motion log:', e);
                }
            }, 2000);
        }

        // Reset → ri-fetch di preset.json dal server: Davide modifica il file,
        // clicca Reset e vede le modifiche SENZA ricaricare la pagina.
        // Il flag è settato da Rust (reset_simulation); qui lo consumiamo e
        // facciamo un fetch fresco con cache-buster, poi ricarichiamo il livello.
        setInterval(() => {
            if (!window.__sandbox || !window.__sandbox.is_preset_reload_requested) return;
            try {
                if (!window.__sandbox.is_preset_reload_requested()) return;
            } catch (e) { return; }
            fetch('assets/preset.json?v=' + Date.now(), { cache: 'no-store' })
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(txt => {
                    try { JSON.parse(txt); } catch (e) {
                        console.warn('preset.json invalido al Reset (' + e.message + ')');
                        return;
                    }
                    try {
                        window.__sandbox.set_preset(txt);
                        window.__sandbox.load_level(txt);
                        console.log('preset.json riletto al Reset (' + txt.length + ' bytes)');
                    } catch (e) {
                        console.warn('Reset: load_level fallita (' + e.message + ')');
                    }
                })
                .catch(err => {
                    console.warn('Reset: preset.json non ricaricato (' + err.message + ')');
                });
        }, 300);

        // Salva → sovrascrive assets/preset.json sul server con il livello
        // corrente (bottone "Salva" in Bevy UI → flag SAVE_PRESET_REQUESTED).
        // save_level() è one-shot: la prima chiamata richiede la serializzazione
        // (SAVE_REQUESTED), la seconda (dopo un frame ECS) restituisce il JSON.
        let savingPreset = false;
        setInterval(() => {
            if (!window.__sandbox || !window.__sandbox.is_save_preset_requested) return;
            if (savingPreset) return; // evita doppie richieste sovrapposte
            let requested = false;
            try {
                requested = window.__sandbox.is_save_preset_requested();
            } catch (e) { return; }
            if (!requested) return;
            savingPreset = true;
            try {
                // 1) Richiedi la serializzazione (setta SAVE_REQUESTED)
                window.__sandbox.save_level();
                // 2) Dopo un frame ECS, leggi il JSON risultante
                setTimeout(() => {
                    let json = '';
                    try { json = window.__sandbox.save_level(); } catch (e) { json = ''; }
                    if (!json || json.length < 2) {
                        console.warn('Salva: JSON vuoto, riprova');
                        savingPreset = false;
                        return;
                    }
                    fetch('/save-preset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: json,
                    })
                        .then(r => {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.json();
                        })
                        .then(res => {
                            // Aggiorna la copia in memoria + conferma
                            try { window.__sandbox.set_preset(json); } catch (e) {}
                            console.log('preset.json salvato sul server (' + json.length + ' bytes)');
                            const v = document.getElementById('version-badge');
                            if (v && v.textContent.indexOf('✅') >= 0) {
                                v.textContent = v.textContent.replace(/ ✅$/, ' ✅ saved');
                                setTimeout(() => { v.textContent = v.textContent.replace(/ saved$/, ''); }, 2000);
                            }
                            savingPreset = false;
                        })
                        .catch(err => {
                            console.warn('Salva: POST /save-preset fallito (' + err.message + ')');
                            savingPreset = false;
                        });
                }, 100);
            } catch (e) {
                console.warn('Salva: errore (' + e.message + ')');
                savingPreset = false;
            }
        }, 300);
    </script>
</body>
</html>
