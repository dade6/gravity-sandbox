<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gravity Sandbox v0.14.7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #bevy-canvas {
            display: block;
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #toolbar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 48px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .tb-btn {
            height: 30px;
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            background: rgba(60, 65, 90, 0.9);
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tb-btn:hover { background: rgba(80, 85, 120, 0.95); color: #fff; }
        .tb-btn.active {
            background: rgba(100, 120, 255, 0.85);
            color: #fff;
            box-shadow: 0 0 8px rgba(100, 120, 255, 0.4);
        }
        #toolbar .spacer { flex: 1; }
        #toolbar .version { color: rgba(255,255,255,0.3); font-size: 12px; pointer-events: none; }

        #timeline {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 16px;
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .tl-btn {
            height: 32px;
            padding: 0 14px;
            border: none;
            border-radius: 6px;
            background: rgba(60, 65, 90, 0.9);
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tl-btn:hover { background: rgba(80, 85, 120, 0.95); color: #fff; }
        .tl-btn.active {
            background: rgba(255, 200, 50, 0.25);
            color: #ffd;
        }
        #timeline .info { color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none; }

        #version-badge {
            position: fixed; bottom: 64px; right: 12px;
            color: rgba(255,255,255,0.25); font: 11px monospace;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.4); padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="bevy-canvas"></canvas>

    <div id="version-badge">v0.14.7</div>
    <div id="debug-state" style="position:fixed;top:22px;left:8px;color:rgba(255,255,255,0.35);font:11px monospace;z-index:99;"></div>

    <script type="module">
        import init, * as sandbox from './gravity_sandbox.js?v=0.14.7';

        window.addEventListener('error', (e) => {
            const v = document.getElementById('version-badge');
            if (v) v.textContent += ' ERR:' + e.message.substring(0, 60);
        });

        init().then(() => {
            // Espone le funzioni del modulo WASM (es. debug_state) per diagnostica
            window.__sandbox = sandbox;
            const v = document.getElementById('version-badge');
            if (v) v.textContent = 'v0.14.7 ✅';
        }).catch(err => {
            const v = document.getElementById('version-badge');
            if (v) v.textContent = 'v0.14.7 🛑' + err.message.substring(0, 60);
        });

        // Diagnostica: mostra tool/drag/selezione in tempo reale (leggibile a colpo d'occhio)
        setInterval(() => {
            const el = document.getElementById('debug-state');
            if (!el || !window.__sandbox) return;
            try {
                const s = JSON.parse(window.__sandbox.debug_state());
                el.textContent = `tool=${s.tool} paused=${s.paused ? 1 : 0} drag=${s.drag_active ? 'ON' : 'off'}${s.drag_engaged ? '/eng' : ''} bodies=${s.bodies ? s.bodies.length : 0}`;
            } catch (e) { /* snapshot non ancora pronto */ }
        }, 500);
    </script>
</body>
</html>
