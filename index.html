<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gravity Sandbox v0.10.0</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
        }
        #bevy-canvas {
            display: block;
            width: 100%; height: 100%;
        }
        #debug-badge {
            position: fixed; bottom: 52px; right: 10px;
            color: rgba(255,255,255,0.35); font: 11px monospace;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.5); padding: 2px 6px;
            border-radius: 4px; max-width: 70%;
            text-align: right; line-height: 1.4;
        }
    </style>
</head>
<body>
    <canvas id="bevy-canvas"></canvas>
    <div id="debug-badge">v0.10.0 caricamento...</div>
    <script type="module">
        import init from './gravity_sandbox.js?v=0.10.0';

        window.addEventListener('error', (e) => {
            const v = document.getElementById('debug-badge');
            if (v) v.textContent += ' 🛑JS:' + e.message.substring(0, 60);
        });

        init().then(() => {
            const v = document.getElementById('debug-badge');
            v.textContent = 'v0.10.0 ✅';
        }).catch(err => {
            const v = document.getElementById('debug-badge');
            v.textContent = 'v0.10.0 🛑WASM:' + err.message.substring(0, 60);
        });
    </script>
</body>
</html>
