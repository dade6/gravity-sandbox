<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gravity Sandbox v0.14.14</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #bevy-canvas {
            display: block;
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #toolbar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 48px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .tb-btn {
            height: 30px;
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            background: rgba(60, 65, 90, 0.9);
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tb-btn:hover { background: rgba(80, 85, 120, 0.95); color: #fff; }
        .tb-btn.active {
            background: rgba(100, 120, 255, 0.85);
            color: #fff;
            box-shadow: 0 0 8px rgba(100, 120, 255, 0.4);
        }
        #toolbar .spacer { flex: 1; }
        #toolbar .version { color: rgba(255,255,255,0.3); font-size: 12px; pointer-events: none; }

        #timeline {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 16px;
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .tl-btn {
            height: 32px;
            padding: 0 14px;
            border: none;
            border-radius: 6px;
            background: rgba(60, 65, 90, 0.9);
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tl-btn:hover { background: rgba(80, 85, 120, 0.95); color: #fff; }
        .tl-btn.active {
            background: rgba(255, 200, 50, 0.25);
            color: #ffd;
        }
        #timeline .info { color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none; }

        #version-badge {
            position: fixed; bottom: 64px; right: 12px;
            color: rgba(255,255,255,0.25); font: 11px monospace;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.4); padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="bevy-canvas" tabindex="0"></canvas>

    <div id="version-badge">v0.14.14</div>
    <div id="debug-state" style="position:fixed;bottom:80px;left:12px;color:#ffffff;background:rgba(0,0,0,0.75);padding:10px 18px;border-radius:10px;font:44px monospace;z-index:99;"></div>
    <!-- Log eventi tastiera (diagnosi iOS): mostra l'ultima sequenza di eventi -->
    <div id="event-log" style="position:fixed;bottom:20px;left:12px;color:#ffd27f;background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:8px;font:16px monospace;z-index:99;"></div>
    <!-- Tastiera mobile: input invisibile che cattura i tasti iOS (fuori schermo,
         NON display:none — altrimenti iOS non mostra la tastiera).
         Parte in stato readonly: il focus sincrono non apre la tastiera finché
         il polling non toglie readonly quando un campo Bevy è attivo. -->
    <input id="hidden-input" type="text" readonly autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           style="position:fixed;top:-300px;left:0;width:1px;height:1px;opacity:0;border:none;padding:0;z-index:-1;">

    <script type="module">
        import init, * as sandbox from './gravity_sandbox.js?v=0.14.14';

        // === Tastiera mobile (iOS) ===
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const hiddenInput = document.getElementById('hidden-input');
        let lastFieldText = '';
        let lastFocusOn = false;
        // Rects dei campi (aggiornati dal polling) per l'hit test sincrono al tocco
        let fieldRects = [];
        // Log eventi per la diagnosi della tastiera iOS
        let eventLog = [];
        function logEv(msg) {
            eventLog.push(msg);
            if (eventLog.length > 5) eventLog.shift();
        }

        // Focus DOM del canvas: senza questo, il browser non instrada gli
        // eventi tastiera a winit/Bevy su WASM (i tasti vanno al body).
        // Su iOS è ESCLUSO: il click che segue il tap ruberebbe il focus
        // all'input nascosto della tastiera (campo che si disattiva dopo
        // mezzo secondo). Su iOS i tasti arrivano via hidden-input.
        const canvasEl = document.getElementById('bevy-canvas');
        if (!isIOS) {
            canvasEl.addEventListener('click', () => canvasEl.focus());
            canvasEl.addEventListener('pointerdown', () => canvasEl.focus());
        }

        if (isIOS && hiddenInput) {
            // Su iOS il canvas NON deve essere focussabile: il click nativo del
            // browser (che segue il tap ~0.5s dopo) gli darebbe il focus a causa
            // di tabindex, rubandolo all'input nascosto -> tastiera chiusa e
            // campo disattivato. Il focus canvas serve solo su Mac.
            canvasEl.removeAttribute('tabindex');

            // Il testo digitato nella tastiera iOS viene inoltrato al campo Bevy
            hiddenInput.addEventListener('input', () => {
                logEv('input:' + hiddenInput.value);
                if (window.__sandbox) {
                    window.__sandbox.set_mobile_input_mode(2);
                    window.__sandbox.set_focused_text(hiddenInput.value);
                }
            });
            // Chiusura tastiera (manuale o per tap fuori): riattiva il sync
            hiddenInput.addEventListener('blur', () => {
                logEv('BLUR_input');
                if (window.__sandbox) window.__sandbox.set_mobile_input_active(false);
            });
            hiddenInput.addEventListener('focus', () => {
                logEv('focus_input');
            });

            // Hit test SINCrono al tocco: iOS permette il focus su un input solo
            // dentro un handler di tocco. Se il dito è su un campo: focus + tastiera.
            // Se è fuori: chiudi tastiera e focus Bevy (zoom/pan non disturbati).
            canvasEl.addEventListener('touchstart', (e) => {
                if (!window.__sandbox) return;
                // Refresh sincrono dei rects (lo snapshot ha max ~300ms di ritardo)
                try {
                    const s = JSON.parse(window.__sandbox.debug_state());
                    if (Array.isArray(s.field_rects) && s.field_rects.length > 0) fieldRects = s.field_rects;
                    if (s.focused_text) lastFieldText = s.focused_text;
                } catch (err) { /* snapshot non pronto */ }
                const t = e.touches[0];
                if (!t) return;
                const rect = canvasEl.getBoundingClientRect();
                const x = t.clientX - rect.left;
                const y = t.clientY - rect.top;
                const onField = fieldRects.some(r => x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]);
                if (onField) {
                    // Tap su campo: focus sincrono (gesture) + select-all + sync sospeso
                    logEv('tap:CAMPO');
                    hiddenInput.value = '';
                    hiddenInput.readOnly = false;
                    hiddenInput.focus();
                    window.__sandbox.set_mobile_input_active(true);
                    window.__sandbox.set_mobile_input_mode(1);
                    window.__sandbox.set_focused_text(lastFieldText || '');
                } else {
                    // Tap fuori: applica l'ultimo valore digitato, poi chiudi tutto
                    logEv('tap:fuori');
                    if (hiddenInput.value !== '') {
                        window.__sandbox.set_focused_text(hiddenInput.value);
                    }
                    window.__sandbox.set_mobile_input_active(false);
                    hiddenInput.readOnly = true;
                    hiddenInput.blur();
                    // Il clear del focus Bevy un attimo dopo (il sync ha applicato).
                    // Solo se conosciamo i rects: senza, non toccare il focus
                    // (evita la disattivazione del campo appena aperto).
                    if (fieldRects.length > 0) {
                        setTimeout(() => {
                            logEv('clear_focus');
                            if (window.__sandbox) window.__sandbox.clear_field_focus();
                        }, 250);
                    }
                }
            }, { passive: true });
        }

        window.addEventListener('error', (e) => {
            const v = document.getElementById('version-badge');
            if (v) v.textContent += ' ERR:' + e.message.substring(0, 60);
        });

        init().then(() => {
            // Espone le funzioni del modulo WASM (es. debug_state) per diagnostica
            window.__sandbox = sandbox;
            const v = document.getElementById('version-badge');
            if (v) v.textContent = 'v0.14.14 ✅';
        }).catch(err => {
            const v = document.getElementById('version-badge');
            if (v) v.textContent = 'v0.14.14 🛑' + err.message.substring(0, 60);
        });

        // Diagnostica: mostra tool/drag/selezione in tempo reale (leggibile a colpo d'occhio)
        setInterval(() => {
            const el = document.getElementById('debug-state');
            if (!el || !window.__sandbox) return;
            try {
                const s = JSON.parse(window.__sandbox.debug_state());
                const toolShort = { Select: 'SEL', Add: 'ADD', Move: 'MOV', Delete: 'DEL' }[s.tool] || s.tool;
                const focusOn = s.focus !== 4294967295;
                el.textContent = `${toolShort} | ${s.paused ? 'PAUSA' : 'PLAY'} | drag ${s.drag_active ? (s.drag_engaged ? 'ON' : 'hold') : 'off'} | focus ${focusOn ? 'ON' : 'off'} | ${s.bodies ? s.bodies.length : 0} corpi${s.focused_text ? ' | ' + s.focused_text.substring(0, 14) : ''}`;

                // Transizione del focus bevy (per la diagnosi)
                if (focusOn !== lastFocusOn) {
                    logEv(focusOn ? 'focus:ON' : 'focus:OFF');
                    lastFocusOn = focusOn;
                }
                // Mostra il log eventi
                const logEl = document.getElementById('event-log');
                if (logEl) logEl.textContent = eventLog.join('  ');

                // Mantiene i dati per l'hit test sincrono del touchstart (iOS):
                // rects dei campi + testo del campo attivo
                if (isIOS) {
                    if (Array.isArray(s.field_rects)) fieldRects = s.field_rects;
                    if (s.focused_text) lastFieldText = s.focused_text;
                }
            } catch (e) { /* snapshot non ancora pronto */ }
        }, 300);
    </script>
</body>
</html>
