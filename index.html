<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gravity Sandbox v0.14.79</title>
    <script>
        // CONSOLE SU IPHONE: Eruda compare SOLO con ?debug nell'URL
        // (es. https://...ts.net:10000/?debug): bottone in basso a destra
        // -> console log/errori/network. Senza flag: nessun bottone.
        (function () {
            if (!new URLSearchParams(location.search).has('debug')) return;
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda';
            s.onload = function () { window.eruda && window.eruda.init(); };
            document.head.appendChild(s);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #bevy-canvas {
            display: block;
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        #toolbar {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 48px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .tb-btn {
            height: 30px;
            padding: 0 12px;
            border: none;
            border-radius: 6px;
            background: rgba(60, 65, 90, 0.9);
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tb-btn:hover { background: rgba(80, 85, 120, 0.95); color: #fff; }
        .tb-btn.active {
            background: rgba(100, 120, 255, 0.85);
            color: #fff;
            box-shadow: 0 0 8px rgba(100, 120, 255, 0.4);
        }
        #toolbar .spacer { flex: 1; }
        #toolbar .version { color: rgba(255,255,255,0.3); font-size: 12px; pointer-events: none; }

        #timeline {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 16px;
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .tl-btn {
            height: 32px;
            padding: 0 14px;
            border: none;
            border-radius: 6px;
            background: rgba(60, 65, 90, 0.9);
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .tl-btn:hover { background: rgba(80, 85, 120, 0.95); color: #fff; }
        .tl-btn.active {
            background: rgba(255, 200, 50, 0.25);
            color: #ffd;
        }
        #timeline .info { color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none; }

        #version-badge {
            position: fixed; bottom: 64px; right: 12px;
            color: rgba(255,255,255,0.25); font: 11px monospace;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.4); padding: 2px 6px;
            border-radius: 4px;
        }
        #error-details {
            position: fixed; top: 56px; left: 12px; right: 12px;
            z-index: 300;
            background: rgba(20, 8, 8, 0.92);
            border: 1px solid rgba(255, 80, 80, 0.5);
            border-radius: 8px;
            padding: 8px 10px;
            max-height: 45vh;
            overflow: auto;
            -webkit-user-select: text; user-select: text;
            -webkit-overflow-scrolling: touch;
        }
        #error-details pre {
            font: 11px/1.45 ui-monospace, Menlo, monospace;
            color: #ffb4b4; white-space: pre-wrap; word-break: break-all;
            margin: 0 0 6px 0; -webkit-user-select: text; user-select: text;
        }
        #copy-err {
            font: 12px -apple-system, sans-serif;
            background: rgba(255, 80, 80, 0.25); color: #ffd7d7;
            border: 1px solid rgba(255, 120, 120, 0.6); border-radius: 5px;
            padding: 4px 10px; cursor: pointer; display: block; margin-bottom: 6px;
        }
        #copy-err:active { background: rgba(255, 80, 80, 0.45); }

        /* Barra di caricamento WASM all'avvio: progresso reale del download
           (%) -> fase "Compilazione…" (indeterminata) -> fade-out quando l'app
           è pronta. #ui-overlay resta pointer-events:none: la barra ha
           pointer-events:auto SOLO su se stessa e non copre la toolbar. */
        #loading-bar {
            position: absolute;
            top: 50%; left: 50%;
            width: 300px;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            transition: opacity 0.45s ease;
            z-index: 1;
        }
        #loading-bar .lb-panel {
            background: rgba(12, 12, 24, 0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            padding: 14px 16px;
        }
        #loading-bar .lb-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.2px;
        }
        #loading-bar .lb-track {
            position: relative;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }
        #loading-bar .lb-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            background: rgba(100, 120, 255, 0.85);
            border-radius: 3px;
            transition: width 0.1s ease-out;
        }
        /* Indeterminato (Compilazione… / Riprovo…): colonna che scorre nel
           track. instantiate è un blocco sincrono senza % osservabile: fase,
           non percentuale finta. */
        #loading-bar.lb-indeterminate .lb-fill {
            width: 40%;
            animation: lb-slide 1.1s ease-in-out infinite;
        }
        @keyframes lb-slide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        /* Errore di init: barra/label rosse + pannello bordato rosso invece
           di sparire (niente barra "sospesa" a metà). */
        #loading-bar.lb-error .lb-panel { border-color: rgba(255, 80, 80, 0.55); }
        #loading-bar.lb-error .lb-fill {
            background: rgba(255, 80, 80, 0.85);
            animation: none;
        }
        #loading-bar.lb-error .lb-label { color: #ffb4b4; }
        /* App pronta: fade out prima di nascostare */
        #loading-bar.lb-done { opacity: 0; }
        /* Inizialmente nascosta: mostrata da JS appena parte il download */
        #loading-bar.lb-hidden { display: none; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>
<body>
    <canvas id="bevy-canvas" tabindex="0"></canvas>

    <div id="version-badge">v0.14.79</div>
    <div id="debug-state" style="position:fixed;bottom:80px;left:12px;color:#ffffff;background:rgba(0,0,0,0.75);padding:10px 18px;border-radius:10px;font:12px monospace;z-index:99;"></div>
    <div id="error-details" hidden>
        <button id="copy-err">📋 Copia errore</button>
        <pre id="error-text"></pre>
    </div>

    <!-- Overlay UI (z-index 100, pointer-events:none): contiene la barra di
         caricamento WASM all'avvio. La barra ha pointer-events:auto solo per
         sé, così non blocca né copre la toolbar (che sta sopra, separata). -->
    <div id="ui-overlay">
        <div id="loading-bar" class="lb-hidden" aria-live="polite">
            <div class="lb-panel">
                <div class="lb-label" id="lb-label">Download…</div>
                <div class="lb-track"><div class="lb-fill" id="lb-fill"></div></div>
            </div>
        </div>
    </div>

    <script type="module">
        // WebGPU richiede un CONTESTO SICURO (HTTPS): su HTTP il browser non
        // espone navigator.gpu e bevy panica (FailedToCreateSurfaceForAnyBackend).
        // Avviso chiaro invece del crash + badge spiegato.
        if (!window.isSecureContext) {
            const v = document.getElementById('version-badge');
            if (v) v.textContent = '⚠️ WebGPU richiede HTTPS: apri https://instance-20260607-0236.tail8514d0.ts.net:10000/';
        }
        import init, * as sandbox from './gravity_sandbox_p79.js?v=0.14.79';

        // Focus DOM del canvas: senza questo, il browser non instrada gli
        // eventi tastiera a winit/Bevy su WASM (i tasti vanno al body).
        // Vale per desktop E tastiera fisica su iPhone (niente input nascosto:
        // il fronte tastiera virtuale mobile è stato chiuso — editing su Mac).
        // Bridge tastiera Safari Mac: input nascosto (vedi sotto). Dichiarato
        // qui perché i listener di focus devono escluderlo dal furto di focus.
        let hiddenInput = null;
        const canvasEl = document.getElementById('bevy-canvas');
        // Focus DOM del canvas, robusto anche su Safari Mac: Safari annulla il
        // focus() durante pointerdown se non preceduto da preventDefault; in
        // aggiunta, un keydown con capture sul document ri-focalizza il canvas
        // prima che il tasto vada altrove (i campi Bevy ricevono i tasti solo
        // se il canvas ha il focus del browser).
        canvasEl.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            canvasEl.focus({ preventScroll: true });
        });
        canvasEl.addEventListener('click', () => canvasEl.focus({ preventScroll: true }));
        document.addEventListener('keydown', () => { if (!hiddenInput || document.activeElement !== hiddenInput) canvasEl.focus({ preventScroll: true }); }, { capture: true });
        document.addEventListener('keyup', () => { if (!hiddenInput || document.activeElement !== hiddenInput) canvasEl.focus({ preventScroll: true }); }, { capture: true });

        // Rilevazione dispositivo mobile: abilita il keypad numerico Bevy
        // (l'editing valori su iPhone avviene col keypad, non con la tastiera
        // di sistema che iOS Safari non permette di controllare)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        // Safari Mac: Bevy/winit non riceve i tasti fisici -> bridge con
        // input nascosto: quando un campo Bevy ha il focus, il focus del
        // browser va su questo input e i tasti vengono inoltrati a Rust via
        // set_text_input(mode, testo) -> apply_mobile_text_input li applica.
        const isSafariMac = !isIOS && /Safari/.test(navigator.userAgent) && !/Chrome|CriOS/.test(navigator.userAgent);
        function hiddenInputEnsure() {
            if (hiddenInput) return hiddenInput;
            hiddenInput = document.createElement('input');
            hiddenInput.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;z-index:-1;width:1px;height:1px;border:0;padding:0;font-size:16px;';
            hiddenInput.autocomplete = 'off';
            hiddenInput.autocapitalize = 'off';
            hiddenInput.spellcheck = false;
            hiddenInput.addEventListener('input', () => {
                if (window.__sandbox && window.__sandbox.set_text_input) {
                    window.__sandbox.set_text_input(2, hiddenInput.value);
                }
            });
            document.body.appendChild(hiddenInput);
            return hiddenInput;
        }

        // Pannello errore copiabile: mostra messaggio completo + stack in un
        // elemento selezionabile, con bottone "Copia" (clipboard API su HTTPS).
        // Utile per la diagnosi remota senza DevTools: Davide copia e incolla.
        // Intercetta ANCHE console.error: il panic hook di lib.rs scrive lì il
        // messaggio "PANIC: panicked at src/...:line" — senza questo, la
        // posizione esatta del trap si perde (il pannello vede solo il
        // RuntimeError generico).
        function appendError(text) {
            const box = document.getElementById('error-details');
            const pre = document.getElementById('error-text');
            if (!pre) return;
            const line = '[' + new Date().toISOString().substring(11, 23) + '] ' + text;
            const existing = pre.textContent;
            pre.textContent = existing ? existing + '\n' + line : line;
            if (box) box.hidden = false;
        }
        const origError = console.error.bind(console);
        console.error = (...args) => {
            try { appendError(args.map(a => (a && a.message) ? a.message : String(a)).join(' ').substring(0, 1500)); } catch (e) {}
            origError(...args);
        };
        function showError(title, message, stack) {
            appendError(title + '\n' + message + (stack ? '\nSTACK:\n' + stack : ''));
            const v = document.getElementById('version-badge');
            if (v && v.textContent.indexOf('🛑') < 0 && v.textContent.indexOf('ERR:') < 0) {
                v.textContent += ' ERR:' + (message || '').substring(0, 300);
            }
        }
        const copyBtn = document.getElementById('copy-err');
        if (copyBtn) {
            copyBtn.addEventListener('click', () => {
                const txt = (document.getElementById('error-text') || {}).textContent || '';
                const done = () => { copyBtn.textContent = '✅ Copiato'; setTimeout(() => { copyBtn.textContent = '📋 Copia errore'; }, 2000); };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(done).catch(() => {
                        // fallback: selezione manuale
                        const pre = document.getElementById('error-text');
                        const range = document.createRange();
                        range.selectNodeContents(pre);
                        const sel = window.getSelection();
                        sel.removeAllRanges(); sel.addRange(range);
                        done();
                    });
                } else {
                    const pre = document.getElementById('error-text');
                    const range = document.createRange();
                    range.selectNodeContents(pre);
                    const sel = window.getSelection();
                    sel.removeAllRanges(); sel.addRange(range);
                    done();
                }
            });
        }

        window.addEventListener('error', (e) => {
            const stack = (e.error && e.error.stack ? e.error.stack : '').substring(0, 3000);
            showError('ERRORE RUNTIME', e.message || String(e.error || 'unknown'), stack);
            console.error('[PAGEERROR full]', e.message, stack);
        });

        // Retry automatico del WASM: su connessioni instabili (Tailscale/DERP)
        // il fetch del .wasm può interrompersi a metà ("Load failed") -> il
        // browser NON riscarica da solo: ritentiamo fino a MAX_INIT_TRIES.
        // FIX CORS Safari (v0.14.68): il fetch INTERNO del glue wasm-bindgen
        // fallisce con "due to access control checks" su Safari/iOS anche con
        // server CORS a posto (il preflight ora è gestito). QUESTO fetch
        // manuale usa lo stesso identico pattern del preset.json (che su
        // Safari funziona sempre) e passa la Response al glue -> il glue NON
        // esegue più alcun fetch interno (__wbg_load usa direct la Response).
        // Cache-buster sul wasm: una versione nuova = URL nuovo = mai cache.
        //
        // Barra di caricamento (v0.14.79): il fetch legge il body a chunk con
        // un ReadableStream, accumula i byte in un Uint8Array e riporta la
        // % REALE di download (bar > 0), poi la fase "Compilazione…". A fetch
        // completato passa i BYTE ACCUMULATI a init({ module_or_path }) — un
        // BufferSource che wasm-bindgen compila direttamente, senza alcun
        // fetch interno (vincolo Safari preservato).
        //
        // GZIP: serve_wasm.py serve il .gz precompresso con Content-Encoding:
        // gzip, quindi Content-Length è la taglia COMPRESSA ma il body letto
        // dal reader è DECOMPRESSO (il browser elimina da solo la codifica).
        // Usare Content-Length come totale sforerebbe oltre 100%. Il totale
        // DECOMPRESSO arriva dall'header X-Wasm-Decompressed-Length (aggiunto
        // da serve_wasm.py quando serve il .gz) oppure dal file sidecar
        // gravity_sandbox_bg.wasm.size (scritto da build_wasm.sh). Se nessuna
        // taglia affidabile, barra "indeterminata" (Download…): mai % finta.
        const WASM_URL = new URL('gravity_sandbox_p79_bg.wasm?v=0.14.79', location.href).href;
        const WASM_SIZE_URL = new URL('gravity_sandbox_p79_bg.wasm.size?v=0.14.79', location.href).href;
        const MAX_INIT_TRIES = 3;

        // ---- Barra di caricamento: stati = download % -> compilazione -> done/errore.
        // Utilizza i token visivi della toolbar (pannelli rgba(12,12,24,0.8), blur,
        // raggio 6px, testo bianco/0.6, accento rgba(100,120,255,0.85)).
        const lbEl = document.getElementById('loading-bar');
        const lbFill = document.getElementById('lb-fill');
        const lbLabel = document.getElementById('lb-label');
        let lbPctKnown = false;   // taglia totale affidabile per la %?
        let lbLastPaint = 0;      // throttle ~100ms degli aggiornamenti
        let lbFinished = false;   // app pronta o errore: barra "finalizzata"
        let lbTotal = null;       // taglia DECOMPRESSA del wasm (sidecar), o null
        function lbShow() {
            if (lbEl) lbEl.classList.remove('lb-hidden');
        }
        function lbSetPct(pct) {
            // pct in [0..100] o null -> indeterminata
            if (!lbFill || !lbEl || lbFinished) return;
            const now = Date.now();
            if (pct == null) {
                // indeterminate: nessuna % conoscibile (chunked o fase compilazione)
                lbEl.classList.add('lb-indeterminate');
                lbFill.style.width = '0%';
                return;
            }
            if (now - lbLastPaint < 100 && pct < 99) return; // throttle
            lbLastPaint = now;
            lbEl.classList.remove('lb-indeterminate');
            lbFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
        }
        function lbSetLabel(txt) { if (lbLabel) lbLabel.textContent = txt; }
        // done = app pronta: fade out (opacity presente nel CSS) poi display:none
        function lbDone() {
            lbFinished = true;
            if (!lbEl) return;
            lbEl.classList.remove('lb-indeterminate');
            lbEl.style.opacity = '0';
            setTimeout(() => { if (lbEl) lbEl.style.display = 'none'; }, 460);
        }
        // errore finale: stati in rosso, barra NON sparisce
        function lbError(msg) {
            lbFinished = true;
            if (!lbEl) return;
            lbEl.classList.remove('lb-indeterminate', 'lb-hidden');
            lbEl.classList.add('lb-error');
            // barra rossa piena: comunica chiaramente lo stato di errore
            if (lbFill) lbFill.style.width = '100%';
            if (lbLabel) lbLabel.textContent = 'Errore: ' + msg;
        }

        function initWithRetry(tries) {
            const n = tries || MAX_INIT_TRIES;
            lbShow();
            if (tries) {
                const left = tries - 1;
                lbSetLabel(left === 1 ? 'Riprovo… (1 tentativo rimasto)' : 'Riprovo… (' + left + ' tentativi rimasti)');
            }
            lbSetPct(null);
            // Totale DECOMPRESSO del wasm per la % reale: pre-fetch del file
            // sidecar gravity_sandbox_bg.wasm.size (pochi byte), scritto da
            // build_wasm.sh. Serve SOLO quando il server manda il .gz
            // (Content-Encoding: gzip): il Content-Length è la taglia compressa
            // ma il reader emette byte decompressi. Se il sidecar manca
            // (server vecchio), lbTotal resta null -> barra indeterminata.
            // L'header X-Wasm-Decompressed-Length (serve_wasm.py) vince sul
            // sidecar quando è presente (0 round-trip extra).
            return fetch(WASM_SIZE_URL, { cache: 'no-store' })
                .then(r => (r.ok ? r.text().then(t => { const v = parseInt(t, 10); return isFinite(v) && v > 0 ? v : null; }) : null))
                .catch(() => null)
                .then((sideSize) => {
                    lbTotal = sideSize;
                    // Fetch manuale con progresso reale: legge il body a chunk,
                    // accumula i byte, calcola la % dal totale decompresso.
                    return fetch(WASM_URL, { cache: 'no-store' });
                })
                .then(r => {
                    if (!r.ok) throw new Error('wasm fetch HTTP ' + r.status);
                    const enc = (r.headers.get('Content-Encoding') || '').toLowerCase();
                    const gzipWasm = enc.indexOf('gzip') >= 0;
                    // Totale per la %:
                    //  - gzip attivo -> il reader emette byte DECOMPRESSI: il
                    //    totale reale è la taglia decompressa (header o sidecar),
                    //    NON il Content-Length (che è la taglia compressa).
                    //  - non gzip    -> il reader emette i byte grezzi, identici
                    //    a Content-Length: totale affidabile da lì.
                    let total = null;
                    if (gzipWasm) {
                        const hDec = parseInt(r.headers.get('X-Wasm-Decompressed-Length') || '', 10);
                        total = (isFinite(hDec) && hDec > 0) ? hDec : lbTotal;
                    } else {
                        const cl = parseInt(r.headers.get('Content-Length') || '', 10);
                        total = (isFinite(cl) && cl > 0) ? cl : null;
                    }
                    lbPctKnown = total != null && total > 0;
                    if (!lbPctKnown) {
                        // nessuna taglia affidabile (sidecar mancante + gzip,
                        // o chunked): indeterminata (non blocchiamo MAI).
                        lbSetLabel('Download…');
                        lbSetPct(null);
                    } else {
                        lbSetLabel('Download… 0%');
                        lbSetPct(0);
                    }
                    if (!r.body) {
                        // body indisponibile: passa la Response al glue (come prima)
                        return { bytes: null, resp: r };
                    }
                    const reader = r.body.getReader();
                    const chunks = [];
                    let received = 0;
                    const totalBytes = lbPctKnown ? total : -1;
                    function pump() {
                        return reader.read().then(({ done, value }) => {
                            if (done) {
                                // concatena i chunk in un Uint8Array unico
                                const bytes = new Uint8Array(received);
                                let off = 0;
                                for (const c of chunks) { bytes.set(c, off); off += c.byteLength; }
                                return { bytes, resp: null };
                            }
                            chunks.push(value);
                            received += value.byteLength;
                            if (totalBytes > 0) {
                                const pct = Math.min(100, (received / totalBytes) * 100);
                                lbSetPct(pct);
                                lbSetLabel('Download… ' + Math.floor(pct) + '%');
                            }
                            return pump();
                        });
                    }
                    return pump();
                })
                .then(({ bytes, resp }) => {
                    // Download completo -> fase COMPILAZIONE (indeterminata).
                    // instantiate è un blocco sincrono: nessuna % reale osservabile
                    // dal browser -> NON inventiamo percentuali fasulle.
                    lbSetLabel('Compilazione…');
                    lbSetPct(null);
                    // Passa i BYTE accumulati (BufferSource) al glue. Sulla prima
                    // fetch ok con body, bytes è il download completo; se body è
                    // mancante passiamo la Response (stesso pattern di prima).
                    return init({ module_or_path: bytes || resp });
                })
                .catch((err) => {
                    if (n <= 1) throw err;
                    console.warn('[INIT retry]', n - 1, 'tentativi rimasti:', err.message);
                    return new Promise((r) => setTimeout(r, 1500)).then(() => initWithRetry(n - 1));
                });
        }

        initWithRetry().then(() => {
            // App pronta (subito prima di esporre il sandbox): fade out barra.
            lbDone();
            // Espone le funzioni del modulo WASM (es. debug_state) per diagnostica
            window.__sandbox = sandbox;
            if (isIOS) sandbox.set_mobile_device(true);
            const v = document.getElementById('version-badge');
            if (v) v.textContent = 'v0.14.79 ✅';

            // Preset di livello esterno (assets/preset.json): Davide lo modifica sul
            // server e con un refresh vede il cambio, SENZA ricompilare il WASM.
            // - Dentro init().then() per garantire che il WASM sia pronto quando
            //   load_level() usa __wbindgen_malloc (chiamarlo prima = TypeError).
            // - Cache-buster (?v=Date.now) + no-store: Safari non deve servire la
            //   vecchia copia dopo una modifica del file.
            // - Fallback silenzioso: se il fetch fallisce o il JSON è invalido NON
            //   si tocca nulla -> resta il livello hardcoded di DebugSpawnPlugin.
            // - Se OK -> load_level() spinge in LOAD_COMMANDS e process_load_commands
            //   (sistemi/persistence.rs) despawna i corpi di test e spawna quelli del
            //   file al frame ECS successivo (nessun sync richiesto).
            fetch('assets/preset.json?v=' + Date.now(), { cache: 'no-store' })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(txt => {
                    try {
                        JSON.parse(txt); // valida: JSON invalido -> fallback hardcoded
                    } catch (e) {
                        console.warn('preset.json invalido: uso livello hardcoded (' + e.message + ')');
                        return;
                    }
                    try {
                        sandbox.set_preset(txt); // salva il preset per il Reset
                        sandbox.load_level(txt);
                    } catch (e) {
                        console.warn('preset.json load_level fallita: uso livello hardcoded (' + e.message + ')');
                        return;
                    }
                    console.log('preset.json caricato (' + txt.length + ' bytes)');
                })
                .catch(err => {
                    // preset mancante -> livello hardcoded attuale (nessun crash)
                    console.warn('preset.json non caricato: uso livello hardcoded (' + err.message + ')');
                });
        }).catch(err => {
            // Errore finale di init: barra in stato errore (NON sparisce né resta
            // sospesa a metà) + showError / badge esistenti.
            lbError(err.message || String(err));
            const v = document.getElementById('version-badge');
            if (v) v.textContent = 'v0.14.79 🛑' + err.message.substring(0, 120);
            showError('ERRORE INIT', err.message || String(err), err.stack ? err.stack.substring(0, 3000) : '');
            console.error('[INIT FAIL full]', err.message, err.stack ? err.stack.substring(0, 2000) : '');
        });

        // Diagnostica: mostra tool/drag/selezione in tempo reale (leggibile a colpo d'occhio).
        // Se il WASM crasha (trap non-panic), debug_state() lancia -> mostriamo
        // l'ULTIMO SISTEMA eseguito dal flight recorder e lo stato congelato.
        let lastSys = '';
        let lastSnap = null;
        let wasmDead = false;
        let lastFocusEnt = -1; // entity Bevy focussata (bridge Safari Mac)
        setInterval(async () => {
            const el = document.getElementById('debug-state');
            if (!el || !window.__sandbox) return;
            let s = null;
            const vEl = document.getElementById('version-badge');
            try {
                s = JSON.parse(window.__sandbox.debug_state());
            } catch (e) {
                // Retry immediato (v0.14.68): un singolo poll fallito NON
                // deve marcare WASM DEAD (poll transitori). Solo dopo 3
                // tentativi consecutivi si marca, con la causa esatta.
                let ok2 = false;
                for (let i = 0; i < 3 && !ok2; i++) {
                    try {
                        s = JSON.parse(window.__sandbox.debug_state());
                        ok2 = true;
                    } catch (e3) { await new Promise(r => setTimeout(r, 250)); }
                }
                if (!ok2) {
                    if (!wasmDead) {
                        wasmDead = true;
                        let reason = '?';
                        try {
                            const raw = String(window.__sandbox.debug_state());
                            reason = 'RAW(len' + raw.length + '): ' + raw.slice(0, 160);
                        } catch (e2) {
                            reason = 'THROW: ' + e2.message;
                        }
                        if (vEl) vEl.textContent = 'v0.14.79 🛑 DEAD ' + reason;
                    }
                    return;
                }
            }
            wasmDead = false;
            lastSnap = s;
            // Bridge tastiera Safari Mac: il campo Bevy focussato riceve i
            // tasti tramite l'input nascosto. L'input DOM deve contenere
            // SEMPRE lo stesso testo del campo Bevy: all'apertura (o al cambio
            // campo) si inizializza col valore corrente e selezione totale.
            // PRIMA partiva vuoto -> il DEL su input vuoto NON generava
            // eventi 'input' e la cancellazione non arrivava mai al campo
            // (bug v0.14.79: "DEL non cancella, devo selezionare e ridigitare").
            if (isSafariMac && s && window.__sandbox && window.__sandbox.set_text_input) {
                const focusOn = s.focus !== 4294967295;
                if (focusOn) {
                    const focusChanged = s.focus !== lastFocusEnt;
                    if (focusChanged || !hiddenInput || document.activeElement !== hiddenInput) {
                        const hi = hiddenInputEnsure();
                        let cur = '';
                        if (typeof s.focused_text === 'string') {
                            const eq = s.focused_text.indexOf('=');
                            if (eq >= 0) cur = s.focused_text.slice(eq + 1);
                        }
                        hi.value = cur;
                        hi.focus({ preventScroll: true });
                        hi.select();
                    }
                    lastFocusEnt = s.focus;
                } else {
                    lastFocusEnt = -1;
                    if (hiddenInput && document.activeElement === hiddenInput) {
                        hiddenInput.blur();
                    }
                }
            }
            if (s.last_system) lastSys = s.last_system;
            const toolShort = { Select: 'SEL', Add: 'ADD', Move: 'MOV', Delete: 'DEL' }[s.tool] || s.tool;
            const focusTxt = s.focus !== 4294967295 ? 'focus ON' : 'focus off';
            el.textContent = `${toolShort} | ${s.paused ? 'PAUSA' : 'PLAY'} | drag ${s.drag_active ? (s.drag_engaged ? 'ON' : 'hold') : 'off'} | ${s.bodies ? s.bodies.length : 0} corpi | ${focusTxt}${s.focused_text ? ' | ' + s.focused_text.substring(0, 14) : ''} | sys:${s.last_system || ''} f${s.frame || 0}${s.firefly ? ' | FF:' + (s.firefly.cam ? 'cam' : 'NOcam') + ' L' + s.firefly.lights + '/' + s.firefly.exL + ' O' + s.firefly.occluders + '/' + s.firefly.exO + ' S' + s.firefly.sprites + ' N' + s.firefly.nmaps : ''}`;
            // Diagnostica normal map nel badge versione (leggibile da screenshot)
            const vb = document.getElementById('version-badge');
            if (vb && s.firefly) {
                // Reset del prefisso: il "🛑 DEAD" non deve sopravvivere a un
                // poll riuscito (il badge parte sempre da "v0.14.68 ✅").
                const nm = (vb.textContent.indexOf('N') >= 0 && vb.textContent.indexOf('DEAD') < 0)
                    ? vb.textContent.replace(/ N\d+ m\d+ g\d+ s\d+\/\d+ q\d+$/, '')
                    : 'v0.14.79 ✅';
                vb.textContent = nm + ' N' + s.firefly.nmaps + ' m' + (s.firefly.nmode !== undefined ? s.firefly.nmode : '?') + ' g' + (s.firefly.gnmode !== undefined ? s.firefly.gnmode : '?') + ' s' + (s.firefly.skipN !== undefined ? s.firefly.skipN + '/' + s.firefly.procS : '?') + ' q' + (s.firefly.qItems !== undefined ? s.firefly.qItems : '?');
            }
        }, 300);

        // Reset → ri-fetch di preset.json dal server: Davide modifica il file,
        // clicca Reset e vede le modifiche SENZA ricaricare la pagina.
        // Il flag è settato da Rust (reset_simulation); qui lo consumiamo e
        // facciamo un fetch fresco con cache-buster, poi ricarichiamo il livello.
        setInterval(() => {
            if (!window.__sandbox || !window.__sandbox.is_preset_reload_requested) return;
            try {
                if (!window.__sandbox.is_preset_reload_requested()) return;
            } catch (e) { return; }
            fetch('assets/preset.json?v=' + Date.now(), { cache: 'no-store' })
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                .then(txt => {
                    try { JSON.parse(txt); } catch (e) {
                        console.warn('preset.json invalido al Reset (' + e.message + ')');
                        return;
                    }
                    try {
                        window.__sandbox.set_preset(txt);
                        window.__sandbox.load_level(txt);
                        console.log('preset.json riletto al Reset (' + txt.length + ' bytes)');
                    } catch (e) {
                        console.warn('Reset: load_level fallita (' + e.message + ')');
                    }
                })
                .catch(err => {
                    console.warn('Reset: preset.json non ricaricato (' + err.message + ')');
                });
        }, 300);

        // Salva → sovrascrive assets/preset.json sul server con il livello
        // corrente (bottone "Salva" in Bevy UI → flag SAVE_PRESET_REQUESTED).
        // save_level() è one-shot: la prima chiamata richiede la serializzazione
        // (SAVE_REQUESTED), la seconda (dopo un frame ECS) restituisce il JSON.
        let savingPreset = false;
        setInterval(() => {
            if (!window.__sandbox || !window.__sandbox.is_save_preset_requested) return;
            if (savingPreset) return; // evita doppie richieste sovrapposte
            let requested = false;
            try {
                requested = window.__sandbox.is_save_preset_requested();
            } catch (e) { return; }
            if (!requested) return;
            savingPreset = true;
            try {
                // 1) Richiedi la serializzazione (setta SAVE_REQUESTED)
                window.__sandbox.save_level();
                // 2) Dopo un frame ECS, leggi il JSON risultante
                setTimeout(() => {
                    let json = '';
                    try { json = window.__sandbox.save_level(); } catch (e) { json = ''; }
                    if (!json || json.length < 2) {
                        console.warn('Salva: JSON vuoto, riprova');
                        savingPreset = false;
                        return;
                    }
                    fetch('/save-preset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: json,
                    })
                        .then(r => {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.json();
                        })
                        .then(res => {
                            // Aggiorna la copia in memoria + conferma
                            try { window.__sandbox.set_preset(json); } catch (e) {}
                            console.log('preset.json salvato sul server (' + json.length + ' bytes)');
                            const v = document.getElementById('version-badge');
                            if (v && v.textContent.indexOf('✅') >= 0) {
                                v.textContent = v.textContent.replace(/ ✅$/, ' ✅ saved');
                                setTimeout(() => { v.textContent = v.textContent.replace(/ saved$/, ''); }, 2000);
                            }
                            savingPreset = false;
                        })
                        .catch(err => {
                            console.warn('Salva: POST /save-preset fallito (' + err.message + ')');
                            savingPreset = false;
                        });
                }, 100);
            } catch (e) {
                console.warn('Salva: errore (' + e.message + ')');
                savingPreset = false;
            }
        }, 300);
    </script>
</body>
</html>
